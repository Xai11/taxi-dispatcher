syntax = "proto3";

package taxi.dispatch.v1;

option java_multiple_files = true;
option java_package = "io.github.xai11.dispatchservice.grpc";
option java_outer_classname = "DispatchProto";

// Контракт между ride-api (клиент) и dispatch-service (сервер).
service Dispatch {
  // Найти ближайшего свободного водителя.
  rpc FindDriver(FindDriverRequest) returns (Driver);

  // Закрепить водителя за поездкой (водитель -> BUSY).
  rpc AssignDriver(AssignRequest) returns (AssignResponse);

  // Освободить водителя (водитель -> FREE).
  rpc ReleaseDriver(ReleaseRequest) returns (Empty);

  // server-streaming: позиция водителя в реальном времени.
  rpc StreamDriverLocation(TrackRequest) returns (stream Location);

  // client-streaming: приложение водителя шлёт координаты.
  rpc ReportLocation(stream Location) returns (Ack);
}

message Empty {}

message Ack {
  int64 received = 1;
}

message Location {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  int64 timestamp_ms = 4;
}

message FindDriverRequest {
  double latitude = 1;
  double longitude = 2;
  double radius_km = 3;
}

enum DriverStatus {
  DRIVER_STATUS_UNSPECIFIED = 0;
  FREE = 1;
  BUSY = 2;
  OFFLINE = 3;
}

message Driver {
  string id = 1;
  string name = 2;
  string car = 3;
  DriverStatus status = 4;
  Location location = 5;
}

message AssignRequest {
  string ride_id = 1;
  string driver_id = 2;
}

message AssignResponse {
  bool assigned = 1;
}

message ReleaseRequest {
  string ride_id = 1;
  string driver_id = 2;
}

message TrackRequest {
  string ride_id = 1;
  string driver_id = 2;
}
