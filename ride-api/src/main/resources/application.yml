server:
  port: 8080

spring:
  application:
    name: ride-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ride}
    username: ${DB_USER:ride}
    password: ${DB_PASSWORD:ride}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

grpc:
  client:
    dispatch:
      address: ${DISPATCH_ADDRESS:static://localhost:9090}
      negotiation-type: plaintext
